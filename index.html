<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Continue</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;min-height:100%}
body{display:flex;justify-content:center}
.wrap{width:100%;max-width:720px;min-height:100vh;background:#000}
.top{height:64px;border-bottom:1px solid #252525;display:flex;align-items:center;padding:0 16px;gap:14px}
.logo{font-size:22px;font-weight:700;letter-spacing:.3px}
.step{margin-left:auto;color:#aaa;font-size:14px}
.card{padding:24px 16px 40px}
h1{font-size:27px;line-height:1.2;margin:8px 0 14px}
p{color:#cfcfcf;line-height:1.65;font-size:16px}
.adlabel{text-align:center;color:#777;font-size:13px;margin:24px 0 8px}
.adbox{min-height:90px;border:1px solid #252525;background:#080808;display:flex;align-items:center;justify-content:center;overflow:hidden}
.adbox iframe,.adbox img{max-width:100%;border:0}
.timer{text-align:center;color:#aaa;font-size:14px;margin:22px 0 12px}
button{width:100%;border:0;border-radius:3px;background:#fff;color:#111;padding:15px 18px;font-size:17px;font-weight:700;cursor:pointer}
button:disabled{background:#303030;color:#777;cursor:not-allowed}
.note{text-align:center;color:#666;font-size:12px;margin-top:12px}
.progress{height:3px;background:#222;margin-top:18px}
.progress i{display:block;height:100%;background:#fff;width:20%;transition:.3s}
.hidden{display:none!important}
.success{padding:30px 16px;text-align:center}
.success a{display:block;background:#fff;color:#111;text-decoration:none;padding:15px;border-radius:3px;font-weight:700;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="logo">RODA E MOTOR</div>
    <div class="step" id="stepText">1/5</div>
  </div>

  <div id="gate" class="card">
    <h1>Continue para acessar</h1>
    <p id="description">Aguarde o anúncio carregar. Quando o contador terminar, o botão Continue será liberado.</p>

    <div class="adlabel">Publicidade</div>
    <div class="adbox">
      <!-- COLOQUE AQUI O CÓDIGO DO SEU ANÚNCIO.
           Use somente o código fornecido pelo seu próprio ad network. -->
      <div id="ad-slot"></div>
    </div>

    <div class="timer" id="timer">Aguarde 10 segundos...</div>
    <button id="continueBtn" disabled>Continue</button>
    <div class="note">Etapa <span id="n">1</span> de 5</div>
    <div class="progress"><i id="bar"></i></div>
  </div>

  <div id="success" class="success hidden">
    <h1>Pronto!</h1>
    <p>As 5 etapas foram concluídas.</p>
    <a id="destination" href="#" rel="noopener">ACESSAR AGORA</a>
  </div>
</div>

<script>
/* ===== CONFIGURAÇÃO ===== */
const WAIT_SECONDS = 10;

// Troque somente este endereço pelo seu destino final.
const DESTINATION_URL = "https://example.com";

/*
  Opcional: cole aqui o HTML/JS do seu anúncio autorizado.
  O código é inserido somente no espaço de publicidade.
*/
const AD_CODE = `
<!-- COLE SEU CÓDIGO DE ANÚNCIO AQUI -->
`;
/* ========================= */

const total=5;
let current=1;
let seconds=WAIT_SECONDS;

const timer=document.getElementById("timer");
const btn=document.getElementById("continueBtn");
const stepText=document.getElementById("stepText");
const n=document.getElementById("n");
const bar=document.getElementById("bar");
const adSlot=document.getElementById("ad-slot");
const gate=document.getElementById("gate");
const success=document.getElementById("success");
const destination=document.getElementById("destination");

adSlot.innerHTML=AD_CODE;

function runStep(){
  seconds=WAIT_SECONDS;
  btn.disabled=true;
  btn.textContent="Continue";
  stepText.textContent=current+"/"+total;
  n.textContent=current;
  bar.style.width=((current/total)*100)+"%";
  timer.textContent="Aguarde "+seconds+" segundos...";

  const tick=setInterval(()=>{
    seconds--;
    if(seconds>0){
      timer.textContent="Aguarde "+seconds+" segundos...";
    }else{
      clearInterval(tick);
      timer.textContent="Agora você pode continuar.";
      btn.disabled=false;
    }
  },1000);
}

btn.addEventListener("click",()=>{
  if(btn.disabled) return;
  if(current<total){
    current++;
    window.scrollTo({top:0,behavior:"smooth"});
    runStep();
  }else{
    gate.classList.add("hidden");
    success.classList.remove("hidden");
    destination.href=DESTINATION_URL;
  }
});

runStep();
</script>
</body>
</html>
