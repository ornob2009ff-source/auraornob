<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AURA ORNOB</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#111d35,#07090e 55%);
  color:#eef3ff;
  font-family:Arial,sans-serif;
  line-height:1.8;
}

.container{
  width:94%;
  max-width:900px;
  margin:auto;
}


/* =========================
   PREMIUM HEADER
========================= */

.header{
  text-align:center;
  padding:25px 0 15px;
}

.logo{
  font-size:32px;
  font-weight:800;
  letter-spacing:3px;
  color:#168cff;
  text-shadow:
    0 0 15px #168cff55;
}

.subtitle{
  color:#7f8da5;
  font-size:13px;
  margin-top:4px;
}


/* =========================
   PAGE NUMBER
========================= */

.page-card{
  margin:15px 0;
  padding:18px;
  background:#101722;
  border:1px solid #26354c;
  border-radius:16px;
  text-align:center;
  box-shadow:0 10px 35px #0008;
}

.page-number{
  font-size:20px;
  font-weight:bold;
  color:#fff;
}

.page-number span{
  color:#168cff;
}


/* =========================
   PROGRESS
========================= */

.progress-bg{
  width:100%;
  height:7px;
  background:#202936;
  border-radius:20px;
  overflow:hidden;
  margin-top:13px;
}

.progress{
  height:100%;
  width:16.66%;
  background:#168cff;
  border-radius:20px;
  transition:.4s;
}


/* =========================
   SEARCH
========================= */

.search-box{
  width:100%;
  height:54px;
  background:#111925;
  border:1px solid #2a3b55;
  border-radius:30px;

  display:flex;
  align-items:center;

  padding:0 18px;
  margin:18px 0;
}

.search-icon{
  color:#168cff;
  font-size:22px;
  margin-right:10px;
}

#search{
  width:100%;
  height:100%;
  border:none;
  outline:none;
  background:transparent;
  color:white;
  font-size:16px;
}

#search::placeholder{
  color:#718097;
}


/* =========================
   SEARCH RESULT
========================= */

.result{
  display:none;
  padding:10px 15px;
  margin-bottom:15px;
  border-radius:10px;
  background:#101722;
  color:#7fbaff;
}


/* =========================
   STORY
========================= */

.story{
  background:#10151e;
  border:1px solid #1d2a3b;
  border-radius:16px;
  padding:22px;

  box-shadow:
    0 15px 45px #0009;
}

.line{
  margin:0;
  padding:4px 0;
  font-size:16px;
  color:#e5eaf3;
}

.gap{
  height:28px;
}


/* =========================
   BOTTOM
========================= */

.bottom{
  margin:30px 0 60px;
  padding:25px 15px;

  background:#101722;
  border:1px solid #26354c;
  border-radius:16px;

  text-align:center;
}

.timer{
  color:#aab6c9;
  margin-bottom:16px;
}

.timer strong{
  color:#168cff;
  font-size:22px;
}

button{
  border:none;
  border-radius:11px;
  padding:14px 32px;

  background:#303947;
  color:white;

  font-size:17px;
  font-weight:bold;

  cursor:not-allowed;
}

button.ready{
  background:#168cff;
  box-shadow:0 0 20px #168cff55;
  cursor:pointer;
}


/* =========================
   FINAL
========================= */

.final{
  display:none;
  text-align:center;
  padding:50px 20px;
}

.final h2{
  color:#168cff;
}

.final a{
  display:inline-block;
  padding:15px 30px;

  background:#168cff;
  color:white;

  border-radius:11px;
  text-decoration:none;
  font-weight:bold;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

  .logo{
    font-size:26px;
  }

  .story{
    padding:17px;
  }

  .line{
    font-size:15px;
  }

}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

  <div class="logo">
    AURA ORNOB
  </div>

  <div class="subtitle">
    Premium Story Gateway
  </div>

</div>


<!-- PAGE CARD -->

<div class="page-card">

  <div class="page-number">
    PAGE <span id="pageNumber">1</span> / 6
  </div>

  <div class="progress-bg">
    <div
      class="progress"
      id="progress"
    ></div>
  </div>

</div>


<!-- SEARCH -->

<div class="search-box">

  <span class="search-icon">
    ⌕
  </span>

  <input
    id="search"
    type="search"
    placeholder="Search this page..."
    autocomplete="off"
  >

</div>


<div
  id="result"
  class="result"
></div>


<!-- STORY -->

<div
  id="story"
  class="story"
></div>


<!-- BOTTOM -->

<div class="bottom">

  <div class="timer">

    Scroll to the bottom and wait

    <strong>
      <span id="count">20</span>s
    </strong>

  </div>

  <button
    id="continueBtn"
    disabled
  >
    Continue
  </button>

</div>


<!-- FINAL -->

<div
  id="final"
  class="final"
>

  <h2>
    AURA ORNOB
  </h2>

  <p>
    All pages completed successfully.
  </p>

  <a
    id="finalLink"
    href="#"
  >
    GET KEY / FILE
  </a>

</div>


</div>


<script>

/* =================================
   SETTINGS
================================= */

const TOTAL_PAGES = 6;

const WAIT_SECONDS = 20;


/*
  পরে এখানে তোমার আসল
  Key / File / Destination URL বসাবে
*/

const DESTINATION_URL =
  "https://example.com";


/* =================================
   STORY DATABASE
================================= */

const storyLines = [

"Daniel woke before sunrise and opened the old wooden window.",
"The town outside was quiet beneath a thin layer of morning mist.",
"A soft wind moved through the empty streets.",
"Daniel looked at the clock beside his bed.",
"Today was the day he had been waiting for.",
"For years he had wondered about his grandfather's mysterious story.",
"Nobody in the family believed the story was true.",
"Daniel had always believed there was something hidden behind it.",
"On his desk rested an old leather notebook.",
"Beside the notebook was a small silver key.",


"He placed the key carefully inside his jacket.",
"Then he picked up his old travel bag.",
"The road toward the northern forest was long.",
"Daniel left the house without making any noise.",
"Sunlight slowly appeared above the distant hills.",
"Birds flew between the branches of the trees.",
"The sound of the town disappeared behind him.",
"After an hour he reached an abandoned railway station.",
"The station had not been used for many years.",
"Old signs moved gently in the morning wind.",


"Daniel opened the notebook again.",
"A drawing showed the exact same station.",
"Under the drawing was a strange message.",
"The message told him to wait beside the northern platform.",
"Daniel looked around but saw nobody.",
"Several minutes passed in complete silence.",
"Then a distant whistle came from beyond the forest.",
"A dark train slowly appeared through the fog.",
"It stopped directly in front of Daniel.",
"The doors opened without anyone touching them.",


"Daniel stepped inside the train.",
"The carriage was completely empty.",
"Old blue seats lined both sides of the room.",
"Dust covered the windows.",
"Daniel chose a seat near the front.",
"He placed his bag beside him.",
"After a few seconds the train began moving.",
"The landscape outside changed quickly.",
"Green fields disappeared behind thick forests.",
"Daniel opened the notebook and continued reading.",


"The notebook described a forgotten stone tower.",
"The tower was hidden beyond the northern forest.",
"According to the story, it contained an important secret.",
"Daniel read every word carefully.",
"The train moved deeper into the wilderness.",
"Several hours passed without another passenger appearing.",
"Finally the train slowed down.",
"It stopped beside a completely empty platform.",
"Daniel stepped outside.",
"A narrow path disappeared between the trees.",


"He followed the path into the forest.",
"Large branches blocked the sunlight above him.",
"The air became colder as he walked farther.",
"Occasionally Daniel heard sounds in the distance.",
"He continued forward without turning around.",
"After a long walk he found an old stone bridge.",
"A clear river flowed beneath the bridge.",
"On the other side stood a massive tower.",
"Daniel immediately recognized the building.",
"It was exactly like the drawing in his notebook.",


"The tower door was locked.",
"Daniel reached into his jacket.",
"He took out the silver key.",
"For a moment he wondered whether the key would work.",
"Then he placed it into the lock.",
"The lock turned with a quiet click.",
"The heavy wooden door opened slowly.",
"Darkness filled the entrance.",
"Daniel turned on his flashlight.",
"Then he stepped inside.",


"The walls were covered with strange paintings.",
"Some paintings showed people standing beside the river.",
"Others showed the same silver key.",
"Daniel walked through several empty rooms.",
"At the center of the largest room stood a wooden table.",
"Another notebook rested on the table.",
"This notebook looked much newer.",
"Daniel carefully opened it.",
"The first page contained his own name.",
"He stepped backward in surprise.",


"The following pages described events from his childhood.",
"Every detail was accurate.",
"Some memories had never been told to anyone.",
"Daniel continued reading.",
"The final page contained only one sentence.",
"It said that every journey begins with a question.",
"It also said that answers are rarely found quickly.",
"Daniel finally understood the meaning of the journey.",
"The silver key had never been the real treasure.",
"The journey itself was the message.",


"Outside, the afternoon sun was disappearing.",
"Daniel left the tower carrying both notebooks.",
"The forest looked different in the evening light.",
"He followed the same path back toward the station.",
"The river reflected the orange sky.",
"Daniel stopped on the bridge and looked behind him.",
"Many questions still remained unanswered.",
"But he no longer felt afraid of them.",
"Some mysteries were meant to become journeys.",
"Some journeys were meant to change people.",


"Daniel reached the railway station before sunset.",
"The mysterious train was still waiting.",
"He stepped inside and placed the notebooks on the seat.",
"The doors closed slowly.",
"The train began moving through the forest.",
"Daniel watched the trees disappear behind the window.",
"He thought about his grandfather.",
"Perhaps the secret had always been a lesson.",
"Perhaps every generation had to discover it alone.",
"Daniel smiled and opened the notebook.",


"A blank page was waiting for him.",
"He took a pen from his bag.",
"Then he began writing his own story.",
"He wrote about the town and the railway station.",
"He wrote about the forest and the tower.",
"He wrote about fear and courage.",
"He wrote about questions without simple answers.",
"Most importantly, he wrote about the future.",
"The train continued through the night.",
"And Daniel knew that his journey had only begun."

];


/* =================================
   PAGE DATA
================================= */

let currentPage = 1;


/* =================================
   CREATE CONTENT
================================= */

function createPageContent(page){

  let lines = [];

  /*
    প্রতি Page-এ একই base story
    বিভিন্নভাবে repeat করে বড় content তৈরি করা হচ্ছে।
    
    ফাঁকা 5000px নয়,
    actual text দিয়েই content তৈরি হচ্ছে।
  */

  for(let round=0; round<14; round++){

    storyLines.forEach(line=>{
      lines.push(line);
    });

  }

  return lines;

}


/* =================================
   RENDER PAGE
================================= */

function renderPage(){

  const story =
    document.getElementById("story");

  const search =
    document.getElementById("search");

  const result =
    document.getElementById("result");

  story.innerHTML = "";

  search.value = "";

  result.style.display = "none";

  const lines =
    createPageContent(currentPage);


  lines.forEach((text,index)=>{

    const p =
      document.createElement("p");

    p.className = "line";

    p.textContent = text;

    story.appendChild(p);


    /*
      প্রতি ১০ লাইনের পর
      ছোট gap
    */

    if((index+1)%10===0){

      const gap =
        document.createElement("div");

      gap.className = "gap";

      story.appendChild(gap);

    }

  });


  /*
    Page number
  */

  document.getElementById(
    "pageNumber"
  ).textContent =
    currentPage;


  /*
    Progress
  */

  document.getElementById(
    "progress"
  ).style.width =
    ((currentPage/TOTAL_PAGES)*100)+"%";


  /*
    Timer reset
  */

  document.getElementById(
    "count"
  ).textContent =
    WAIT_SECONDS;


  const button =
    document.getElementById(
      "continueBtn"
    );

  button.disabled = true;

  button.classList.remove("ready");

  button.textContent =
    currentPage < TOTAL_PAGES
    ? "Continue"
    : "GET KEY / FILE";

}


/* =================================
   SEARCH
================================= */

document
.getElementById("search")
.addEventListener("input",function(){

  const query =
    this.value.trim().toLowerCase();

  const story =
    document.getElementById("story");

  const result =
    document.getElementById("result");


  if(!query){

    renderPage();

    return;

  }


  const lines =
    createPageContent(currentPage);


  const matches =
    lines.filter(line =>
      line.toLowerCase().includes(query)
    );


  result.style.display =
    "block";

  result.textContent =
    matches.length +
    " matching line(s) found.";


  story.innerHTML = "";


  matches.forEach(line=>{

    const p =
      document.createElement("p");

    p.className =
      "line";

    p.textContent =
      line;

    story.appendChild(p);

  });

});


/* =================================
   TIMER
================================= */

let timerStarted = false;

function checkBottom(){

  if(timerStarted) return;


  const scrollPosition =
    window.scrollY +
    window.innerHeight;


  const pageHeight =
    document.documentElement
    .scrollHeight;


  if(
    scrollPosition >=
    pageHeight - 30
  ){

    timerStarted = true;


    let remaining =
      WAIT_SECONDS;


    const count =
      document.getElementById(
        "count"
      );


    count.textContent =
      remaining;


    const timer =
      setInterval(()=>{

        remaining--;

        count.textContent =
          Math.max(remaining,0);


        if(remaining <= 0){

          clearInterval(timer);


          const button =
            document.getElementById(
              "continueBtn"
            );


          button.disabled = false;

          button.classList.add(
            "ready"
          );


        }

      },1000);

  }

}


window.addEventListener(
  "scroll",
  checkBottom,
  {passive:true}
);


/* =================================
   CONTINUE
================================= */

document
.getElementById("continueBtn")
.addEventListener("click",function(){

  if(this.disabled) return;


  /*
    Last page
  */

  if(currentPage === TOTAL_PAGES){

    document.getElementById(
      "finalLink"
    ).href =
      DESTINATION_URL;


    document.getElementById(
      "story"
    ).style.display =
      "none";


    document.querySelector(
      ".bottom"
    ).style.display =
      "none";


    document.getElementById(
      "final"
    ).style.display =
      "block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    return;

  }


  /*
    Next page
  */

  currentPage++;

  timerStarted = false;

  renderPage();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


/* =================================
   START
================================= */

renderPage();

</script>

</body>
  </html>
