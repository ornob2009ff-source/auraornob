<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AURA ORNOB</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b12;
  color:#eeeeee;
  font-family:Arial,sans-serif;
  line-height:1.8;
}

.container{
  width:94%;
  max-width:900px;
  margin:auto;
}

/* ===== TOP ===== */

.top{
  padding:22px 0 10px;
  text-align:center;
}

.logo{
  color:#168cff;
  font-size:30px;
  font-weight:bold;
  letter-spacing:2px;
  margin-bottom:14px;
}

/* ===== SEARCH BAR ===== */

.search-box{
  width:100%;
  height:52px;
  background:#151b26;
  border:1px solid #27364d;
  border-radius:28px;
  display:flex;
  align-items:center;
  padding:0 18px;
  margin-bottom:20px;
}

.search-icon{
  font-size:21px;
  color:#168cff;
  margin-right:10px;
}

#search{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
}

#search::placeholder{
  color:#78859a;
}

/* ===== CONTENT ===== */

.story{
  background:#111722;
  border-radius:14px;
  padding:20px;
  box-shadow:0 5px 25px #0009;
}

.line{
  margin:0;
  padding:3px 0;
  font-size:16px;
}

.gap{
  height:28px;
}

/* ===== SEARCH RESULT ===== */

.result{
  display:none;
  background:#151b26;
  padding:12px 15px;
  border-radius:10px;
  margin-bottom:15px;
  color:#8ebeff;
}

mark{
  background:#168cff;
  color:white;
  border-radius:3px;
  padding:1px 3px;
}

/* ===== BOTTOM ===== */

.bottom{
  text-align:center;
  background:#111722;
  border-radius:14px;
  padding:25px 15px;
  margin:30px 0 50px;
}

.timer{
  font-size:18px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 28px;
  background:#3b4350;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button.ready{
  background:#168cff;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
}

/* ===== RESPONSIVE ===== */

@media(max-width:600px){

  .logo{
    font-size:25px;
  }

  .story{
    padding:16px;
  }

  .line{
    font-size:15px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="top">

    <div class="logo">
      AURA ORNOB
    </div>

    <div class="search-box">

      <span class="search-icon">⌕</span>

      <input
        id="search"
        type="search"
        placeholder="Search story..."
        autocomplete="off"
      >

    </div>

  </div>


  <div id="result" class="result"></div>


  <div id="story" class="story"></div>


  <div class="bottom">

    <div class="timer">
      Scroll to the bottom and wait:
      <strong id="count">20</strong>s
    </div>

    <button id="continueBtn" disabled>
      Continue
    </button>

  </div>

</div>


<script>

/* =========================
   SETTINGS
========================= */

const WAIT_SECONDS = 20;


/* =========================
   STORY
========================= */

const paragraphs = [

"Daniel woke before sunrise and quietly opened the old wooden window.",
"The town outside was still sleeping beneath a layer of morning mist.",
"A gentle wind moved through the narrow streets and carried the smell of rain.",
"Daniel looked at the small clock beside his bed and realized that the day had finally arrived.",
"For years he had wondered about the strange story his grandfather had told him.",
"Nobody else in the family believed the story was real.",
"But Daniel had always believed there was something hidden behind those words.",
"On his desk rested an old notebook covered with dust and faded marks.",
"Beside the notebook was a small silver key that he had discovered the previous evening.",
"He placed the key carefully inside his pocket and prepared to leave.",

"The road toward the northern forest was long and almost completely empty.",
"Daniel carried a small bag containing water, food, a flashlight, and the old notebook.",
"As he walked, the sunlight slowly appeared above the distant hills.",
"Birds moved between the branches while the sound of the town disappeared behind him.",
"After an hour he reached an abandoned railway station.",
"The station had not been used for many years.",
"Old signs hung from the walls and moved whenever the wind became stronger.",
"Daniel checked the notebook once again.",
"A drawing inside showed the exact same station.",
"Underneath the drawing was a message telling him to wait.",

"Daniel waited beside the old platform for several minutes.",
"Then he heard a distant sound coming from beyond the trees.",
"A train appeared slowly through the morning fog.",
"It looked older than any train Daniel had ever seen.",
"The train stopped directly in front of him.",
"Nobody opened the doors.",
"Daniel stepped forward and noticed a small silver symbol beside the entrance.",
"The symbol looked exactly like the one drawn in his grandfather's notebook.",
"He touched the symbol with his fingers.",
"The door immediately opened.",

"Inside the train everything was silent.",
"The seats were covered with dark blue fabric and the windows were covered with dust.",
"Daniel chose a seat near the front and placed his bag beside him.",
"After a few seconds the train began moving.",
"The landscape outside changed quickly.",
"Green fields disappeared and tall forests appeared in their place.",
"Daniel opened the notebook and started reading the next page.",
"It described a tower hidden somewhere beyond the forest.",
"The tower was supposed to contain an answer to an old family mystery.",
"Daniel continued reading as the train moved deeper into the wilderness.",

"Several hours passed before the train finally stopped.",
"Daniel stepped onto another empty platform.",
"There was no station building and no sign showing the name of the place.",
"A narrow path began near the tracks and disappeared between the trees.",
"Daniel followed the path while holding the notebook in one hand.",
"The forest became darker as he walked deeper inside.",
"Large trees blocked most of the sunlight.",
"Occasionally he heard strange sounds coming from far away.",
"Still, he continued walking without turning around.",
"He trusted the directions written in the notebook.",

"After a long walk Daniel discovered a stone bridge.",
"A clear river flowed underneath it.",
"On the opposite side stood an enormous stone tower.",
"Daniel stopped because he immediately recognized it.",
"It was exactly the same tower shown in his grandfather's drawings.",
"The tower looked abandoned but its main door was still in perfect condition.",
"Daniel reached into his pocket and removed the silver key.",
"For a moment he wondered whether he should continue.",
"Then he placed the key into the lock.",
"The door opened with a deep and quiet sound.",

"Inside the tower the air was cold.",
"The walls were covered with paintings, maps, and strange symbols.",
"Some of the paintings showed people standing beside the same river.",
"Others showed a small village that Daniel recognized from old family photographs.",
"He moved slowly from one room to another.",
"At the center of the largest room stood a wooden table.",
"On the table was another notebook.",
"This notebook looked much newer than the one Daniel carried.",
"He opened it carefully.",
"The first page contained his own name.",

"Daniel stepped backward in surprise.",
"He wondered how someone could have written his name inside a book hidden in an abandoned tower.",
"The following pages contained descriptions of events from his childhood.",
"Everything was accurate, including memories he had never told anyone.",
"Daniel continued reading until he reached the final page.",
"That page contained only one sentence.",
"It said that every person eventually reaches a moment when they must choose their own path.",
"Daniel closed the notebook and looked around the room.",
"For the first time he understood that the mystery was not about treasure.",
"It was about discovering who he wanted to become.",

"Outside, the afternoon sun began disappearing behind the mountains.",
"Daniel left the tower carrying both notebooks.",
"The journey home felt completely different from the journey there.",
"He no longer felt afraid of the unknown forest.",
"Every tree seemed familiar now.",
"The river reflected the orange light of the evening sky.",
"Daniel stopped on the bridge and looked back at the tower.",
"He knew that many questions were still unanswered.",
"But he also knew that not every question needed an immediate answer.",
"Some journeys were valuable simply because they changed the person who made them.",

"Daniel returned to the railway station just before sunset.",
"The mysterious train was still waiting beside the platform.",
"He stepped inside and placed the notebooks on the seat.",
"The train began moving without anyone controlling it.",
"Through the window Daniel watched the forest disappear.",
"He thought about his grandfather and the strange secret he had protected for so many years.",
"Perhaps the secret had always been a lesson rather than a hidden object.",
"Perhaps the journey was meant to continue through another generation.",
"Daniel smiled and opened the notebook one final time.",
"A new blank page waited for him.",

"He took a pen from his bag and began writing.",
"He wrote about the town, the station, the forest, and the tower.",
"He wrote about fear and courage.",
"He wrote about questions that had no simple answers.",
"He wrote about the people who had influenced his life.",
"Most importantly, he wrote about the future.",
"The train continued through the night while the stars appeared above the windows.",
"Daniel realized that he was no longer searching for someone else's story.",
"He was finally beginning to write his own.",
"And somewhere beyond the dark horizon, another journey was already waiting."

];


/* =========================
   CREATE 12,000px+ CONTENT
========================= */

const storyBox =
  document.getElementById("story");

/*
  120 বার গল্পের অংশ তৈরি করা হচ্ছে।
  ফলে content অনেক লম্বা হবে এবং
  ফাঁকা 12000px বানানো হবে না।
*/

let allLines = [];

for(let round=0; round<120; round++){

  for(let i=0;i<paragraphs.length;i++){

    allLines.push(paragraphs[i]);

    /*
      প্রতি ১০ লাইনের পর
      ছোট natural paragraph gap
    */

    if(allLines.length % 10 === 0){

      allLines.push("");
      allLines.push("");

    }

  }

}


/* =========================
   DISPLAY STORY
========================= */

function showStory(){

  storyBox.innerHTML = "";

  allLines.forEach((text,index)=>{

    if(text === ""){

      const gap =
        document.createElement("div");

      gap.className = "gap";

      storyBox.appendChild(gap);

    }else{

      const p =
        document.createElement("p");

      p.className = "line";

      p.textContent = text;

      storyBox.appendChild(p);

    }

  });

}

showStory();


/* =========================
   SEARCH
========================= */

const search =
  document.getElementById("search");

const result =
  document.getElementById("result");

search.addEventListener("input",()=>{

  const query =
    search.value.trim().toLowerCase();

  if(!query){

    result.style.display = "none";
    showStory();
    return;

  }

  const matches =
    allLines.filter(line =>
      line &&
      line.toLowerCase().includes(query)
    );

  result.style.display = "block";

  result.textContent =
    matches.length +
    " matching line(s) found.";

  storyBox.innerHTML = "";

  matches.forEach(line=>{

    const p =
      document.createElement("p");

    p.className = "line";

    const escaped =
      query.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );

    p.innerHTML =
      line.replace(
        new RegExp(escaped,"gi"),
        match => "<mark>"+match+"</mark>"
      );

    storyBox.appendChild(p);

  });

});


/* =========================
   20 SECOND TIMER
========================= */

const count =
  document.getElementById("count");

const button =
  document.getElementById("continueBtn");

let started = false;

function checkBottom(){

  if(started) return;

  const bottom =
    window.scrollY +
    window.innerHeight;

  const pageHeight =
    document.documentElement.scrollHeight;

  if(bottom >= pageHeight - 30){

    started = true;

    let remaining =
      WAIT_SECONDS;

    count.textContent =
      remaining;

    const timer =
      setInterval(()=>{

        remaining--;

        count.textContent =
          Math.max(remaining,0);

        if(remaining <= 0){

          clearInterval(timer);

          button.disabled = false;

          button.classList.add("ready");

          button.textContent =
            "Continue";

        }

      },1000);

  }

}

window.addEventListener(
  "scroll",
  checkBottom,
  {passive:true}
);


/* =========================
   BUTTON
========================= */

button.addEventListener("click",()=>{

  if(button.disabled) return;

  /*
    এখানে পরে তোমার
    পরের Step / Key / File link
    বসাতে পারবে।
  */

  alert("Next step is ready.");

});

</script>

</body>
</html>
