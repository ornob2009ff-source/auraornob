<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AURA ORNOB</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 50% -10%,
      #12325b 0%,
      #0b1422 28%,
      #060a11 65%,
      #03050a 100%
    );

  color:#eef5ff;

  font-family:
    Arial,
    sans-serif;
}


/* MAIN */

.container{
  width:94%;
  max-width:850px;
  margin:auto;
  padding-bottom:35px;
}


/* HEADER */

.header{
  text-align:center;
  padding:30px 0 18px;
}

.logo{
  font-size:31px;
  font-weight:900;

  letter-spacing:4px;

  color:#2298ff;

  text-shadow:
    0 0 8px #168cff,
    0 0 25px #168cff66,
    0 0 45px #168cff33;
}

.subtitle{
  margin-top:6px;

  color:#71839b;

  font-size:11px;

  letter-spacing:2px;
}


/* PAGE CARD */

.page-card{
  position:relative;

  padding:17px;

  margin-bottom:17px;

  text-align:center;

  border-radius:18px;

  border:1px solid #294463;

  background:
    linear-gradient(
      145deg,
      #111e2e,
      #0a121d
    );

  box-shadow:
    0 12px 35px #000b,
    inset 0 1px 0 #ffffff08;

  overflow:hidden;
}

.page-card:after{
  content:"";

  position:absolute;

  top:0;
  left:25%;

  width:50%;
  height:1px;

  background:#249aff;

  box-shadow:
    0 0 18px #168cff;
}

.page-number{
  font-size:18px;

  font-weight:800;

  letter-spacing:1px;
}

.page-number span{
  color:#2298ff;

  text-shadow:
    0 0 12px #168cff88;
}


/* PROGRESS */

.progress-bg{
  height:5px;

  margin-top:13px;

  background:#202c3c;

  border-radius:20px;

  overflow:hidden;
}

.progress{
  height:100%;

  width:16.66%;

  border-radius:20px;

  background:
    linear-gradient(
      90deg,
      #087be9,
      #42aaff
    );

  box-shadow:
    0 0 12px #168cffaa;

  transition:.5s;
}


/* SEARCH */

.search-box{
  height:53px;

  display:flex;
  align-items:center;

  padding:0 18px;

  margin-bottom:17px;

  border-radius:30px;

  border:1px solid #29415e;

  background:
    linear-gradient(
      145deg,
      #0e1927,
      #09111b
    );

  box-shadow:
    0 10px 30px #0009,
    inset 0 1px 0 #ffffff08;
}

.search-icon{
  color:#2298ff;

  font-size:22px;

  margin-right:10px;

  text-shadow:
    0 0 10px #168cff;
}

#search{
  width:100%;
  height:100%;

  border:0;
  outline:0;

  background:transparent;

  color:#fff;

  font-size:15px;
}

#search::placeholder{
  color:#667990;
}


/* RESULT */

.result{
  display:none;

  margin-bottom:15px;

  padding:10px 14px;

  border-radius:12px;

  color:#69b4ff;

  border:1px solid #294463;

  background:#0d1928;
}


/* STORY */

.story{
  min-height:200px;

  padding:18px;

  border-radius:18px;

  border:1px solid #20354e;

  background:
    linear-gradient(
      145deg,
      #101a27,
      #080f18
    );

  box-shadow:
    0 15px 40px #000b,
    inset 0 1px 0 #ffffff07;
}

.line{
  margin:0;

  padding:2px 0;

  font-size:14px;

  line-height:1.65;

  color:#dce7f5;
}

.gap{
  height:9px;
}


/* BOTTOM PAGE */

.bottom-page{
  margin-top:18px;
}


/* CONTINUE AREA */

.bottom{

  margin-top:15px;

  padding:24px 15px 20px;

  text-align:center;

  border-radius:18px;

  border:1px solid #29415d;

  background:
    linear-gradient(
      145deg,
      #111d2c,
      #0a111b
    );

  box-shadow:
    0 15px 40px #000b,
    inset 0 1px 0 #ffffff08;
}

.timer{
  color:#8999ad;

  font-size:13px;

  margin-bottom:16px;
}

.timer strong{
  color:#2298ff;

  font-size:22px;

  margin-left:5px;

  text-shadow:
    0 0 12px #168cff88;
}


/* BUTTON */

button{

  width:85%;

  max-width:330px;

  padding:14px 20px;

  border:1px solid #39485a;

  border-radius:12px;

  background:
    linear-gradient(
      145deg,
      #303b4a,
      #252e3a
    );

  color:#77869a;

  font-size:16px;

  font-weight:800;

  cursor:not-allowed;

  transition:.25s;
}

button.ready{

  color:#fff;

  border-color:#168cff;

  background:
    linear-gradient(
      135deg,
      #0879e8,
      #2298ff
    );

  cursor:pointer;

  box-shadow:
    0 0 25px #168cff55,
    inset 0 1px 0 #ffffff22;
}

button.ready:hover{
  transform:translateY(-2px);

  box-shadow:
    0 8px 30px #168cff66;
}


/* OWNER ADMIN */

.credits{

  margin-top:15px;

  padding:17px 15px;

  text-align:center;

  border-radius:15px;

  border:1px solid #1f344c;

  background:
    linear-gradient(
      145deg,
      #0d1724,
      #080f18
    );

  box-shadow:
    0 10px 25px #0008;
}

.credit-line{

  margin:5px 0;

  font-size:13px;

  letter-spacing:.5px;

  color:#8292a7;
}

.credit-name{

  color:#dce9f8;

  font-weight:800;

}

.owner{
  color:#2298ff;

  text-shadow:
    0 0 8px #168cff55;
}

.admin{
  color:#b8c9dc;
}


/* FINAL */

.final{

  display:none;

  text-align:center;

  padding:50px 15px;

  border-radius:18px;

  border:1px solid #294463;

  background:#0d1724;

  box-shadow:
    0 15px 40px #000b;
}

.final h2{

  color:#2298ff;

  font-size:27px;

  text-shadow:
    0 0 18px #168cff66;
}

.final p{
  color:#8292a7;
}

.final a{

  display:inline-block;

  margin-top:8px;

  padding:14px 30px;

  border-radius:12px;

  background:
    linear-gradient(
      135deg,
      #0879e8,
      #2298ff
    );

  color:white;

  text-decoration:none;

  font-weight:800;

  box-shadow:
    0 0 25px #168cff44;
}


/* MOBILE */

@media(max-width:600px){

  .container{
    width:93%;
  }

  .logo{
    font-size:25px;
    letter-spacing:3px;
  }

  .story{
    padding:15px;
  }

  .line{
    font-size:13.5px;
  }

  button{
    width:92%;
  }

}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

  <div class="logo">
    AURA ORNOB
  </div>

  <div class="subtitle">
    PREMIUM STORY GATEWAY
  </div>

</div>


<!-- TOP PAGE -->

<div class="page-card">

  <div class="page-number">
    PAGE <span id="pageNumber">1</span> / 6
  </div>

  <div class="progress-bg">

    <div
      class="progress"
      id="progress"
    ></div>

  </div>

</div>


<!-- SEARCH -->

<div class="search-box">

  <span class="search-icon">
    ⌕
  </span>

  <input
    id="search"
    type="search"
    placeholder="Search story..."
    autocomplete="off"
  >

</div>


<div
  id="result"
  class="result"
></div>


<!-- STORY -->

<div
  id="story"
  class="story"
></div>


<!-- BOTTOM PAGE -->

<div class="page-card bottom-page">

  <div class="page-number">
    PAGE <span id="pageNumberBottom">1</span> / 6
  </div>

  <div class="progress-bg">

    <div
      class="progress"
      id="progressBottom"
    ></div>

  </div>

</div>


<!-- CONTINUE -->

<div class="bottom">

  <div class="timer">

    Scroll to bottom & wait

    <strong>
      <span id="count">20</span>s
    </strong>

  </div>


  <button
    id="continueBtn"
    disabled
  >
    Continue
  </button>


  <!-- OWNER / ADMIN -->

  <div class="credits">

    <div class="credit-line">
      OWNER :
      <span class="credit-name owner">
        AURA ORNOB
      </span>
    </div>

    <div class="credit-line">
      ADMIN :
      <span class="credit-name admin">
        AURA RAZU YT
      </span>
    </div>

  </div>

</div>


<!-- FINAL -->

<div
  id="final"
  class="final"
>

  <h2>
    AURA ORNOB
  </h2>

  <p>
    All 6 pages completed successfully.
  </p>

  <a
    id="finalLink"
    href="#"
  >
    GET KEY / FILE
  </a>

</div>


</div>


<script>


/* SETTINGS */

const TOTAL_PAGES = 6;

const WAIT_SECONDS = 20;


/*
  এখানে তোমার আসল
  Key / File link বসাবে।
*/

const DESTINATION_URL =
"https://example.com";


/* STORY */

const storyLines = [

"Daniel woke before sunrise and looked outside his window.",
"The small town was quiet beneath the morning mist.",
"A gentle wind moved through the empty streets.",
"He remembered the strange story his grandfather had told him.",
"For years Daniel had wondered if the story was real.",
"On his desk was an old notebook covered with dust.",
"Beside the notebook rested a small silver key.",
"Daniel placed the key inside his jacket.",
"He picked up his travel bag.",
"Then he quietly left his house.",

"The road toward the northern forest was long.",
"Daniel walked beside the old railway line.",
"Birds flew between the tall trees.",
"The morning sun slowly appeared above the hills.",
"After an hour he reached an abandoned station.",
"The station had been empty for many years.",
"Old signs moved in the wind.",
"Daniel opened his grandfather's notebook.",
"A drawing showed the same station.",
"Under the drawing was a mysterious message.",

"The message told him to wait.",
"Daniel stood beside the northern platform.",
"Several quiet minutes passed.",
"Then he heard a distant whistle.",
"A dark train appeared through the fog.",
"The train stopped in front of him.",
"The doors opened by themselves.",
"Daniel stepped inside.",
"The carriage was completely empty.",
"He chose a seat near the window.",

"The train slowly began moving.",
"Fields disappeared behind the window.",
"Thick forests replaced the green fields.",
"Daniel continued reading the notebook.",
"It described an ancient stone tower.",
"The tower was hidden beyond the forest.",
"Nobody in the town knew about it.",
"Daniel decided to follow the directions.",
"The train continued deeper into the wilderness.",
"Several hours passed in silence."

];


/* VARIABLES */

let currentPage = 1;

let timerStarted = false;

let currentLines = [];


/* CREATE PAGE */

function makePage(){

  let lines = [];

  /*
    1 copy = compact
    প্রায় 200px+ হবে
    device অনুযায়ী।
  */

  for(let i=0;i<1;i++){

    storyLines.forEach(line=>{
      lines.push(line);
    });

  }

  return lines;

}


/* RENDER */

function renderPage(){

  const box =
    document.getElementById(
      "story"
    );

  const search =
    document.getElementById(
      "search"
    );

  const result =
    document.getElementById(
      "result"
    );

  const button =
    document.getElementById(
      "continueBtn"
    );


  box.innerHTML = "";

  search.value = "";

  result.style.display =
    "none";

  timerStarted = false;

  currentLines =
    makePage();


  currentLines.forEach(
    (text,index)=>{

      const p =
        document.createElement(
          "p"
        );

      p.className =
        "line";

      p.textContent =
        text;

      box.appendChild(p);


      if(
        (index+1)%10===0
      ){

        const gap =
          document.createElement(
            "div"
          );

        gap.className =
          "gap";

        box.appendChild(gap);

      }

    }
  );


  /* PAGE */

  document.getElementById(
    "pageNumber"
  ).textContent =
    currentPage;


  document.getElementById(
    "pageNumberBottom"
  ).textContent =
    currentPage;


  /* PROGRESS */

  const percentage =
    (currentPage /
    TOTAL_PAGES) * 100;


  document.getElementById(
    "progress"
  ).style.width =
    percentage + "%";


  document.getElementById(
    "progressBottom"
  ).style.width =
    percentage + "%";


  /* TIMER */

  document.getElementById(
    "count"
  ).textContent =
    WAIT_SECONDS;


  button.disabled =
    true;

  button.classList.remove(
    "ready"
  );


  button.textContent =
    currentPage <
    TOTAL_PAGES
    ? "Continue"
    : "GET KEY / FILE";

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
  "input",
  function(){

    const query =
      this.value
      .trim()
      .toLowerCase();


    const box =
      document.getElementById(
        "story"
      );

    const result =
      document.getElementById(
        "result"
      );


    if(!query){

      renderPage();

      return;

    }


    const matches =
      currentLines.filter(
        line =>
        line
        .toLowerCase()
        .includes(query)
      );


    result.style.display =
      "block";


    result.textContent =
      matches.length +
      " result(s) found.";


    box.innerHTML = "";


    matches.forEach(
      line=>{

        const p =
          document.createElement(
            "p"
          );

        p.className =
          "line";

        p.textContent =
          line;

        box.appendChild(p);

      }
    );

  }
);


/* TIMER */

function checkBottom(){

  if(timerStarted)
    return;


  const position =
    window.scrollY +
    window.innerHeight;


  const height =
    document.documentElement
    .scrollHeight;


  if(
    position >=
    height - 30
  ){

    timerStarted =
      true;


    let remaining =
      WAIT_SECONDS;


    const count =
      document.getElementById(
        "count"
      );


    const button =
      document.getElementById(
        "continueBtn"
      );


    count.textContent =
      remaining;


    const timer =
      setInterval(
        ()=>{

          remaining--;


          count.textContent =
            Math.max(
              remaining,
              0
            );


          if(
            remaining <= 0
          ){

            clearInterval(
              timer
            );


            button.disabled =
              false;


            button.classList.add(
              "ready"
            );

          }

        },
        1000
      );

  }

}


window.addEventListener(
  "scroll",
  checkBottom,
  {passive:true}
);


/* CONTINUE */

document
.getElementById(
  "continueBtn"
)
.addEventListener(
  "click",
  function(){

    if(this.disabled)
      return;


    /* LAST PAGE */

    if(
      currentPage ===
      TOTAL_PAGES
    ){

      document.getElementById(
        "finalLink"
      ).href =
        DESTINATION_URL;


      document.getElementById(
        "story"
      ).style.display =
        "none";


      document.querySelector(
        ".bottom"
      ).style.display =
        "none";


      document.querySelector(
        ".bottom-page"
      ).style.display =
        "none";


      document.getElementById(
        "final"
      ).style.display =
        "block";


      window.scrollTo({
        top:0,
        behavior:"smooth"
      });


      return;

    }


    /* NEXT PAGE */

    currentPage++;


    renderPage();


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }
);


/* START */

renderPage();

</script>

</body>
  </html>
