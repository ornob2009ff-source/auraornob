<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Story Gate</title>

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#08090d;
  color:#eee;
  font-family:Arial,sans-serif;
  line-height:1.8;
}

.container{
  width:94%;
  max-width:900px;
  margin:auto;
}

header{
  text-align:center;
  padding:25px 10px;
}

header h1{
  margin:0;
  font-size:30px;
}

.progress{
  color:#999;
  margin-top:8px;
}

.step{
  display:none;
}

.step.active{
  display:block;
}

.story{
  background:#14161d;
  border-radius:14px;
  padding:20px;
  box-shadow:0 5px 25px #0008;
}

.story-line{
  margin:0;
  padding:4px 0;
  font-size:16px;
}

.story-gap{
  height:36px;
}

.ad{
  min-height:90px;
  margin:25px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px dashed #444;
  border-radius:10px;
  color:#777;
}

.bottom{
  margin:30px 0;
  padding:25px 15px;
  text-align:center;
  background:#14161d;
  border-radius:14px;
}

.timer{
  font-size:19px;
  margin-bottom:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:14px 28px;
  background:#444;
  color:#fff;
  font-size:17px;
  font-weight:bold;
  cursor:not-allowed;
}

button.ready{
  background:#00a86b;
  cursor:pointer;
}

button:disabled{
  opacity:.55;
}

.final{
  text-align:center;
  padding:60px 15px;
}

.final a{
  display:inline-block;
  padding:16px 30px;
  border-radius:10px;
  background:#00a86b;
  color:white;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>Story Gate</h1>
  <div class="progress" id="progress">
    Step 1 / 6
  </div>
</header>

<div id="steps"></div>

</div>

<script>

/* =========================
   SETTINGS
========================= */

const TOTAL_STEPS = 6;

const WAIT_SECONDS = 20;

/* পরে এখানে তোমার আসল Key/File link বসাবে */
const DESTINATION_URL = "https://example.com";


/* =========================
   ENGLISH STORY
========================= */

const storyLines = [

"Morning came quietly to the little town.",
"The streets were covered with a soft layer of mist.",
"Daniel opened his window and looked outside.",
"The old clock tower was barely visible in the distance.",
"He had been waiting for this morning for many years.",
"On his desk was a small wooden box.",
"The box had belonged to his grandfather.",
"Inside it was a mysterious silver key.",
"Daniel had never discovered what the key could open.",
"That day he decided to find the answer.",

"He placed the key inside his jacket.",
"Then he picked up an old leather bag.",
"The railway station was his first destination.",
"Nobody knew why he was going there.",
"The station was almost completely empty.",
"A lonely train stood beside the platform.",
"Daniel checked the number written on his ticket.",
"It matched the number on the train.",
"He slowly stepped inside the final carriage.",
"The doors closed behind him.",

"The train began moving through the countryside.",
"Green fields passed quickly outside the window.",
"Daniel opened his grandfather's notebook.",
"Several pages contained drawings of strange symbols.",
"One symbol looked exactly like the silver key.",
"Another drawing showed an old stone tower.",
"Under the drawing was a single sentence.",
"The sentence told him to follow the northern road.",
"Daniel looked at the map beside the window.",
"The northern road was far beyond the station.",

"After two hours the train finally stopped.",
"Daniel stepped onto a quiet platform.",
"There were no shops and no people around.",
"A narrow road disappeared into a forest.",
"He followed the road without looking back.",
"Birds moved between the tall branches.",
"The wind carried the smell of rain.",
"After walking for an hour he found an old bridge.",
"Under the bridge was a clear river.",
"On the other side stood a stone tower.",

"Daniel immediately recognized the tower.",
"It was the same tower from his grandfather's notebook.",
"The large wooden door was locked.",
"He took out the silver key.",
"For a moment he hesitated.",
"Then he placed the key inside the lock.",
"The lock turned with a quiet click.",
"The heavy door slowly opened.",
"Darkness filled the entrance.",
"Daniel stepped into the forgotten tower.",

"Inside, the walls were covered with old paintings.",
"Some paintings showed people he had never seen.",
"Others showed the same silver key.",
"A narrow staircase climbed toward the top.",
"Daniel began walking upward.",
"Every step made a quiet sound.",
"At the highest floor he found a table.",
"On the table was another wooden box.",
"This box was much larger than the first one.",
"A note was attached to its lid.",

"Daniel carefully opened the note.",
"The handwriting looked exactly like his grandfather's.",
"It said that every journey begins with a question.",
"It also said that answers are rarely found quickly.",
"Daniel smiled because he finally understood.",
"The key had never been the real treasure.",
"The journey itself had been the message.",
"He looked through the small window.",
"Sunlight was beginning to enter the tower.",
"For the first time, the old mystery felt peaceful.",

"Daniel closed the notebook and returned downstairs.",
"He locked the tower door behind him.",
"The forest looked different in the afternoon light.",
"He followed the road back toward the station.",
"Along the way he thought about his grandfather.",
"Many questions still remained unanswered.",
"But he no longer felt afraid of them.",
"Some mysteries were meant to become journeys.",
"Some journeys were meant to change people.",
"And Daniel knew his journey had only begun."

];


/* =========================
   CREATE LONG STORY
========================= */

function createStory(multiplier){

  let output = [];

  for(let round=0; round<multiplier; round++){

    for(let i=0;i<storyLines.length;i++){

      output.push(storyLines[i]);

      /*
       প্রতি ১০ লাইনের পর ২ লাইনের gap
      */
      if((i+1)%10===0){
        output.push("");
        output.push("");
      }

    }

  }

  return output;
}


/* =========================
   CREATE STEPS
========================= */

const stepsBox = document.getElementById("steps");

for(let step=1;step<=TOTAL_STEPS;step++){

  const section = document.createElement("section");

  section.className =
    "step" + (step===1 ? " active" : "");

  section.id = "step-"+step;

  const story = document.createElement("div");

  story.className = "story";

  /*
    প্রতিটি Step-এ অনেক গল্প।
    একই গল্প বারবার না দেখিয়ে
    বড় content তৈরি করার জন্য
    বিভিন্ন অংশ যোগ করা হচ্ছে।
  */

  const lines = createStory(20);

  lines.forEach((line)=>{

    if(line===""){

      const gap = document.createElement("div");

      gap.className = "story-gap";

      story.appendChild(gap);

    }else{

      const p = document.createElement("p");

      p.className = "story-line";

      p.textContent = line;

      story.appendChild(p);

    }

  });


  section.appendChild(story);


  /*
    Ad area
  */

  const ad = document.createElement("div");

  ad.className = "ad";

  ad.textContent = "ADVERTISEMENT";

  section.appendChild(ad);


  /*
    Bottom section
  */

  const bottom = document.createElement("div");

  bottom.className = "bottom";

  bottom.innerHTML = `
    <div class="timer">
      Scroll to the bottom and wait:
      <strong class="count">${WAIT_SECONDS}</strong>s
    </div>

    <button disabled>
      Continue
    </button>
  `;

  section.appendChild(bottom);

  stepsBox.appendChild(section);
}


/* =========================
   STEP SYSTEM
========================= */

let currentStep = 1;

const sections =
  document.querySelectorAll(".step");

const progress =
  document.getElementById("progress");


function setupStep(step){

  const section =
    document.getElementById("step-"+step);

  const button =
    section.querySelector("button");

  const counter =
    section.querySelector(".count");

  let started = false;
  let finished = false;

  function checkBottom(){

    if(started || finished) return;

    const rect =
      section.getBoundingClientRect();

    const sectionBottom =
      rect.bottom + window.scrollY;

    const viewportBottom =
      window.scrollY + window.innerHeight;

    if(viewportBottom >= sectionBottom - 30){

      started = true;

      let remaining = WAIT_SECONDS;

      counter.textContent = remaining;

      const timer = setInterval(()=>{

        remaining--;

        counter.textContent =
          Math.max(remaining,0);

        if(remaining<=0){

          clearInterval(timer);

          finished = true;

          button.disabled = false;

          button.classList.add("ready");

          button.textContent =
            step < TOTAL_STEPS
            ? "Continue"
            : "Get Key / File";
        }

      },1000);

    }

  }


  window.addEventListener(
    "scroll",
    checkBottom,
    {passive:true}
  );


  button.addEventListener("click",()=>{

    if(!finished) return;

    if(step < TOTAL_STEPS){

      currentStep++;

      sections.forEach(s=>{
        s.classList.remove("active");
      });

      const next =
        document.getElementById(
          "step-"+currentStep
        );

      next.classList.add("active");

      progress.textContent =
        "Step " +
        currentStep +
        " / " +
        TOTAL_STEPS;

      window.scrollTo({
        top:0,
        behavior:"smooth"
      });

      setupStep(currentStep);

    }else{

      window.location.href =
        DESTINATION_URL;

    }

  });

}


/* প্রথম Step চালু */

setupStep(1);

</script>

</body>
</html>
