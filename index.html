<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AURA ORNOB</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080b12;
  color:#eef3ff;
  font-family:Arial,sans-serif;
  line-height:1.8;
}

.container{
  width:94%;
  max-width:850px;
  margin:auto;
}

/* HEADER */

.header{
  text-align:center;
  padding:25px 0 12px;
}

.logo{
  color:#168cff;
  font-size:30px;
  font-weight:bold;
  letter-spacing:3px;
}

.subtitle{
  color:#78879d;
  font-size:13px;
  margin-top:4px;
}

/* PAGE INDICATOR */

.page-card{
  background:#111824;
  border:1px solid #26364e;
  border-radius:16px;
  padding:17px;
  text-align:center;
  margin:12px 0 18px;
}

.page-number{
  font-size:20px;
  font-weight:bold;
}

.page-number span{
  color:#168cff;
}

.progress-bg{
  height:6px;
  background:#222b39;
  border-radius:20px;
  margin-top:12px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:16.66%;
  background:#168cff;
  transition:.4s;
}

/* SEARCH */

.search-box{
  height:52px;
  display:flex;
  align-items:center;
  padding:0 17px;
  margin-bottom:18px;

  background:#111824;
  border:1px solid #2a3b55;
  border-radius:28px;
}

.search-icon{
  color:#168cff;
  font-size:21px;
  margin-right:10px;
}

#search{
  width:100%;
  height:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:16px;
}

#search::placeholder{
  color:#718096;
}

/* STORY */

.story{
  background:#111722;
  border:1px solid #1e2b3d;
  border-radius:16px;
  padding:20px;
  box-shadow:0 10px 35px #0008;
}

.line{
  margin:0;
  padding:4px 0;
  font-size:16px;
}

.gap{
  height:22px;
}

/* RESULT */

.result{
  display:none;
  background:#111824;
  color:#7eb9ff;
  border-radius:10px;
  padding:10px 14px;
  margin-bottom:14px;
}

/* BOTTOM */

.bottom{
  text-align:center;
  margin:25px 0 50px;
  padding:22px 15px;

  background:#111824;
  border:1px solid #26364e;
  border-radius:16px;
}

.timer{
  color:#aab6c8;
  margin-bottom:14px;
}

.timer strong{
  color:#168cff;
  font-size:21px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 30px;

  background:#3b4554;
  color:white;

  font-size:17px;
  font-weight:bold;
  cursor:not-allowed;
}

button.ready{
  background:#168cff;
  cursor:pointer;
  box-shadow:0 0 20px #168cff55;
}

/* FINAL */

.final{
  display:none;
  text-align:center;
  padding:45px 15px;
}

.final h2{
  color:#168cff;
}

.final a{
  display:inline-block;
  padding:14px 28px;
  background:#168cff;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-weight:bold;
}

@media(max-width:600px){

  .logo{
    font-size:25px;
  }

  .story{
    padding:16px;
  }

  .line{
    font-size:15px;
  }

}
</style>
</head>

<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      AURA ORNOB
    </div>

    <div class="subtitle">
      Premium Story Gateway
    </div>

  </div>


  <!-- PAGE NUMBER -->

  <div class="page-card">

    <div class="page-number">
      PAGE <span id="pageNumber">1</span> / 6
    </div>

    <div class="progress-bg">
      <div
        class="progress"
        id="progress"
      ></div>
    </div>

  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <span class="search-icon">⌕</span>

    <input
      id="search"
      type="search"
      placeholder="Search story..."
      autocomplete="off"
    >

  </div>


  <div
    id="result"
    class="result"
  ></div>


  <!-- STORY -->

  <div
    id="story"
    class="story"
  ></div>


  <!-- TIMER -->

  <div class="bottom">

    <div class="timer">

      Scroll to the bottom and wait

      <strong>
        <span id="count">20</span>s
      </strong>

    </div>

    <button
      id="continueBtn"
      disabled
    >
      Continue
    </button>

  </div>


  <!-- FINAL -->

  <div
    id="final"
    class="final"
  >

    <h2>AURA ORNOB</h2>

    <p>
      All 6 pages completed.
    </p>

    <a
      id="finalLink"
      href="#"
    >
      GET KEY / FILE
    </a>

  </div>

</div>


<script>

/* ==========================
   SETTINGS
========================== */

const TOTAL_PAGES = 6;

const WAIT_SECONDS = 20;


/* পরে এখানে তোমার আসল Key/File link বসাবে */

const DESTINATION_URL =
"https://example.com";


/* ==========================
   STORY
========================== */

const story = [

"Daniel woke before sunrise and looked outside his window.",
"The small town was quiet beneath the morning mist.",
"A gentle wind moved through the empty streets.",
"He remembered the strange story his grandfather had told him.",
"For years Daniel had wondered if the story was real.",
"On his desk was an old notebook covered with dust.",
"Beside the notebook rested a small silver key.",
"Daniel placed the key inside his jacket.",
"He picked up his travel bag.",
"Then he quietly left his house.",


"The road toward the northern forest was long.",
"Daniel walked beside the old railway line.",
"Birds flew between the tall trees.",
"The morning sun slowly appeared above the hills.",
"After an hour he reached an abandoned station.",
"The station had been empty for many years.",
"Old signs moved in the wind.",
"Daniel opened his grandfather's notebook.",
"A drawing showed the same station.",
"Under the drawing was a mysterious message.",


"The message told him to wait.",
"Daniel stood beside the northern platform.",
"Several quiet minutes passed.",
"Then he heard a distant whistle.",
"A dark train appeared through the fog.",
"The train stopped in front of him.",
"The doors opened by themselves.",
"Daniel stepped inside.",
"The carriage was completely empty.",
"He chose a seat near the window.",


"The train slowly began moving.",
"Fields disappeared behind the window.",
"Thick forests replaced the green fields.",
"Daniel continued reading the notebook.",
"It described an ancient stone tower.",
"The tower was hidden beyond the forest.",
"Nobody in the town knew about it.",
"Daniel decided to follow the directions.",
"The train continued deeper into the wilderness.",
"Several hours passed in silence.",


"Finally the train stopped.",
"Daniel stepped onto another empty platform.",
"A narrow path disappeared between the trees.",
"He followed the path carefully.",
"The forest became darker.",
"Large branches blocked the sunlight.",
"After a long walk he found a stone bridge.",
"A clear river flowed underneath it.",
"On the other side stood a massive tower.",
"Daniel recognized the tower immediately.",


"It was the same tower from the drawing.",
"The main door was locked.",
"Daniel took the silver key from his pocket.",
"He placed it inside the lock.",
"The lock turned with a quiet click.",
"The heavy door opened slowly.",
"Inside was complete darkness.",
"Daniel turned on his flashlight.",
"The walls were covered with strange paintings.",
"Some paintings showed the same silver key.",


"Daniel walked through several empty rooms.",
"At the center of the largest room was a wooden table.",
"Another notebook rested on the table.",
"It looked much newer than his own notebook.",
"Daniel carefully opened it.",
"The first page contained his own name.",
"He stepped backward in surprise.",
"The following pages described his childhood.",
"Every detail was accurate.",
"Daniel continued reading.",


"The final page contained a single sentence.",
"It said that every journey begins with a question.",
"It also said that answers are rarely found quickly.",
"Daniel finally understood the mystery.",
"The silver key was not the real treasure.",
"The journey itself was the message.",
"He closed the notebook.",
"Outside, the sun was beginning to set.",
"Daniel left the tower.",
"He carried both notebooks with him.",


"The forest looked different in the evening light.",
"Daniel followed the path back to the station.",
"The river reflected the orange sky.",
"He stopped on the bridge for a moment.",
"Many questions still remained unanswered.",
"But he was no longer afraid of them.",
"Some mysteries become meaningful journeys.",
"Some journeys change people forever.",
"Daniel continued walking.",
"The railway station appeared in the distance.",


"The mysterious train was still waiting.",
"Daniel stepped inside.",
"He placed the notebooks on the seat.",
"The doors closed slowly.",
"The train began moving through the forest.",
"Daniel watched the trees disappear.",
"He thought about his grandfather.",
"Perhaps the secret had always been a lesson.",
"Perhaps every generation had to discover it.",
"Daniel opened the notebook one final time."

];


/* ==========================
   CREATE PAGE CONTENT
========================== */

function makePage(){

  let lines=[];

  /*
    5 copies = roughly 1200px+
    depending on device/font size.
  */

  for(let i=0;i<5;i++){

    story.forEach(line=>{
      lines.push(line);
    });

  }

  return lines;
}


/* ==========================
   VARIABLES
========================== */

let currentPage=1;

let timerStarted=false;

let currentLines=[];


/* ==========================
   RENDER
========================== */

function renderPage(){

  const box=
    document.getElementById("story");

  const search=
    document.getElementById("search");

  const result=
    document.getElementById("result");

  const button=
    document.getElementById("continueBtn");

  box.innerHTML="";

  search.value="";

  result.style.display="none";

  timerStarted=false;

  currentLines=makePage();


  currentLines.forEach((text,index)=>{

    const p=
      document.createElement("p");

    p.className="line";

    p.textContent=text;

    box.appendChild(p);


    /* প্রতি ১০ লাইনের পর ছোট gap */

    if((index+1)%10===0){

      const gap=
        document.createElement("div");

      gap.className="gap";

      box.appendChild(gap);

    }

  });


  document.getElementById(
    "pageNumber"
  ).textContent=currentPage;


  document.getElementById(
    "progress"
  ).style.width=
    ((currentPage/TOTAL_PAGES)*100)+"%";


  document.getElementById(
    "count"
  ).textContent=WAIT_SECONDS;


  button.disabled=true;

  button.classList.remove("ready");

  button.textContent=
    currentPage<TOTAL_PAGES
    ? "Continue"
    : "GET KEY / FILE";

}


/* ==========================
   SEARCH
========================== */

document
.getElementById("search")
.addEventListener("input",function(){

  const q=
    this.value.trim().toLowerCase();

  const box=
    document.getElementById("story");

  const result=
    document.getElementById("result");


  if(!q){

    renderPage();

    return;

  }


  const matches=
    currentLines.filter(line=>
      line.toLowerCase().includes(q)
    );


  result.style.display="block";

  result.textContent=
    matches.length+
    " result(s) found.";


  box.innerHTML="";


  matches.forEach(line=>{

    const p=
      document.createElement("p");

    p.className="line";

    p.textContent=line;

    box.appendChild(p);

  });

});


/* ==========================
   BOTTOM TIMER
========================== */

function checkBottom(){

  if(timerStarted)return;


  const position=
    window.scrollY+
    window.innerHeight;


  const height=
    document.documentElement.scrollHeight;


  if(position>=height-30){

    timerStarted=true;

    let remaining=
      WAIT_SECONDS;


    const count=
      document.getElementById("count");

    const button=
      document.getElementById(
        "continueBtn"
      );


    count.textContent=remaining;


    const timer=
      setInterval(()=>{

        remaining--;

        count.textContent=
          Math.max(remaining,0);


        if(remaining<=0){

          clearInterval(timer);

          button.disabled=false;

          button.classList.add("ready");

        }

      },1000);

  }

}


window.addEventListener(
  "scroll",
  checkBottom,
  {passive:true}
);


/* ==========================
   CONTINUE
========================== */

document
.getElementById("continueBtn")
.addEventListener("click",function(){

  if(this.disabled)return;


  /* শেষ Page */

  if(currentPage===TOTAL_PAGES){

    document.getElementById(
      "finalLink"
    ).href=
      DESTINATION_URL;


    document.getElementById(
      "story"
    ).style.display="none";


    document.querySelector(
      ".bottom"
    ).style.display="none";


    document.getElementById(
      "final"
    ).style.display="block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    return;

  }


  /* পরের Page */

  currentPage++;

  renderPage();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


/* START */

renderPage();

</script>

</body>
  </html>
