<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>AURA ORNOB</title>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#101c30 0%,#080b12 45%,#05070b 100%);
  color:#eef4ff;
  font-family:Arial,sans-serif;
  line-height:1.7;
}

.container{
  width:94%;
  max-width:850px;
  margin:auto;
}


/* HEADER */

.header{
  text-align:center;
  padding:28px 0 15px;
}

.logo{
  color:#168cff;
  font-size:31px;
  font-weight:800;
  letter-spacing:4px;
  text-shadow:
    0 0 10px #168cff66,
    0 0 30px #168cff33;
}

.subtitle{
  color:#8190a7;
  font-size:12px;
  letter-spacing:1.5px;
  margin-top:5px;
}


/* PAGE CARD */

.page-card{
  position:relative;
  overflow:hidden;

  background:
    linear-gradient(
      145deg,
      #121d2d,
      #0d141f
    );

  border:1px solid #263b58;
  border-radius:18px;

  padding:17px;

  text-align:center;

  margin:12px 0 18px;

  box-shadow:
    0 12px 35px #0009,
    inset 0 1px 0 #ffffff08;
}

.page-card:before{
  content:"";
  position:absolute;
  top:0;
  left:20%;
  width:60%;
  height:1px;
  background:#168cff;
  box-shadow:0 0 20px #168cff;
}

.page-number{
  font-size:19px;
  font-weight:800;
  letter-spacing:1px;
}

.page-number span{
  color:#168cff;
  text-shadow:0 0 10px #168cff77;
}

.progress-bg{
  height:6px;
  background:#202b3a;
  border-radius:20px;
  margin-top:13px;
  overflow:hidden;
}

.progress{
  height:100%;
  width:16.66%;

  background:
    linear-gradient(
      90deg,
      #0879e8,
      #42a7ff
    );

  border-radius:20px;

  box-shadow:
    0 0 12px #168cff88;

  transition:.5s;
}


/* SEARCH */

.search-box{
  height:54px;

  display:flex;
  align-items:center;

  padding:0 18px;

  margin-bottom:18px;

  background:#0e1622;

  border:1px solid #293d59;

  border-radius:30px;

  box-shadow:
    0 10px 25px #0007,
    inset 0 1px 0 #ffffff07;
}

.search-icon{
  color:#168cff;
  font-size:22px;
  margin-right:10px;
}

#search{
  width:100%;
  height:100%;

  border:0;
  outline:0;

  background:transparent;

  color:white;

  font-size:15px;
}

#search::placeholder{
  color:#687990;
}


/* RESULT */

.result{
  display:none;

  background:#101b2a;

  color:#66adff;

  border:1px solid #263c59;

  border-radius:12px;

  padding:10px 14px;

  margin-bottom:14px;
}


/* STORY */

.story{
  position:relative;

  background:
    linear-gradient(
      145deg,
      #101722,
      #0b111a
    );

  border:1px solid #1f3046;

  border-radius:18px;

  padding:20px;

  min-height:300px;

  box-shadow:
    0 15px 40px #0009,
    inset 0 1px 0 #ffffff06;
}

.line{
  margin:0;
  padding:3px 0;
  font-size:15px;
  color:#dce6f5;
}

.gap{
  height:15px;
}


/* BOTTOM PAGE */

.bottom-page{
  margin-top:20px;
}


/* BOTTOM */

.bottom{

  text-align:center;

  margin:18px 0 45px;

  padding:23px 15px;

  background:
    linear-gradient(
      145deg,
      #121d2c,
      #0c131d
    );

  border:1px solid #293d58;

  border-radius:18px;

  box-shadow:
    0 15px 35px #0009,
    inset 0 1px 0 #ffffff07;
}

.timer{
  color:#a4b1c3;

  margin-bottom:15px;

  font-size:14px;
}

.timer strong{
  color:#168cff;

  font-size:22px;

  margin-left:5px;

  text-shadow:
    0 0 12px #168cff66;
}

button{

  border:0;

  border-radius:11px;

  padding:14px 35px;

  background:#303a49;

  color:#8794a7;

  font-size:16px;

  font-weight:bold;

  transition:.25s;

  cursor:not-allowed;
}

button.ready{

  background:
    linear-gradient(
      135deg,
      #0879e8,
      #168cff
    );

  color:white;

  cursor:pointer;

  box-shadow:
    0 0 25px #168cff55;
}

button.ready:hover{
  transform:translateY(-2px);
  box-shadow:
    0 5px 30px #168cff77;
}


/* FINAL */

.final{

  display:none;

  text-align:center;

  padding:50px 15px;
}

.final h2{

  color:#168cff;

  font-size:26px;

  text-shadow:
    0 0 15px #168cff66;
}

.final a{

  display:inline-block;

  padding:14px 30px;

  background:
    linear-gradient(
      135deg,
      #0879e8,
      #168cff
    );

  color:white;

  text-decoration:none;

  border-radius:11px;

  font-weight:bold;

  box-shadow:
    0 0 25px #168cff44;
}


/* MOBILE */

@media(max-width:600px){

  .logo{
    font-size:25px;
    letter-spacing:3px;
  }

  .story{
    padding:16px;
  }

  .line{
    font-size:14px;
  }

}

</style>
</head>


<body>

<div class="container">


<!-- HEADER -->

<div class="header">

  <div class="logo">
    AURA ORNOB
  </div>

  <div class="subtitle">
    PREMIUM STORY GATEWAY
  </div>

</div>


<!-- TOP PAGE -->

<div class="page-card">

  <div class="page-number">
    PAGE <span id="pageNumber">1</span> / 6
  </div>

  <div class="progress-bg">

    <div
      class="progress"
      id="progress"
    ></div>

  </div>

</div>


<!-- SEARCH -->

<div class="search-box">

  <span class="search-icon">
    ⌕
  </span>

  <input
    id="search"
    type="search"
    placeholder="Search story..."
    autocomplete="off"
  >

</div>


<div
  id="result"
  class="result"
></div>


<!-- STORY -->

<div
  id="story"
  class="story"
></div>


<!-- BOTTOM PAGE -->

<div class="page-card bottom-page">

  <div class="page-number">
    PAGE <span id="pageNumberBottom">1</span> / 6
  </div>

  <div class="progress-bg">

    <div
      class="progress"
      id="progressBottom"
    ></div>

  </div>

</div>


<!-- TIMER -->

<div class="bottom">

  <div class="timer">

    Scroll to the bottom and wait

    <strong>
      <span id="count">20</span>s
    </strong>

  </div>

  <button
    id="continueBtn"
    disabled
  >
    Continue
  </button>

</div>


<!-- FINAL -->

<div
  id="final"
  class="final"
>

  <h2>
    AURA ORNOB
  </h2>

  <p>
    All 6 pages completed successfully.
  </p>

  <a
    id="finalLink"
    href="#"
  >
    GET KEY / FILE
  </a>

</div>

</div>


<script>


/* SETTINGS */

const TOTAL_PAGES = 6;

const WAIT_SECONDS = 20;


/*
  এখানে তোমার আসল
  Key / File link বসাবে।
*/

const DESTINATION_URL =
"https://example.com";


/* STORY */

const storyLines = [

"Daniel woke before sunrise and looked outside his window.",
"The small town was quiet beneath the morning mist.",
"A gentle wind moved through the empty streets.",
"He remembered the strange story his grandfather had told him.",
"For years Daniel had wondered if the story was real.",
"On his desk was an old notebook covered with dust.",
"Beside the notebook rested a small silver key.",
"Daniel placed the key inside his jacket.",
"He picked up his travel bag.",
"Then he quietly left his house.",

"The road toward the northern forest was long.",
"Daniel walked beside the old railway line.",
"Birds flew between the tall trees.",
"The morning sun slowly appeared above the hills.",
"After an hour he reached an abandoned station.",
"The station had been empty for many years.",
"Old signs moved in the wind.",
"Daniel opened his grandfather's notebook.",
"A drawing showed the same station.",
"Under the drawing was a mysterious message.",

"The message told him to wait.",
"Daniel stood beside the northern platform.",
"Several quiet minutes passed.",
"Then he heard a distant whistle.",
"A dark train appeared through the fog.",
"The train stopped in front of him.",
"The doors opened by themselves.",
"Daniel stepped inside.",
"The carriage was completely empty.",
"He chose a seat near the window.",

"The train slowly began moving.",
"Fields disappeared behind the window.",
"Thick forests replaced the green fields.",
"Daniel continued reading the notebook.",
"It described an ancient stone tower.",
"The tower was hidden beyond the forest.",
"Nobody in the town knew about it.",
"Daniel decided to follow the directions.",
"The train continued deeper into the wilderness.",
"Several hours passed in silence.",

"Finally the train stopped.",
"Daniel stepped onto another empty platform.",
"A narrow path disappeared between the trees.",
"He followed the path carefully.",
"The forest became darker.",
"Large branches blocked the sunlight.",
"After a long walk he found a stone bridge.",
"A clear river flowed underneath it.",
"On the other side stood a massive tower.",
"Daniel recognized the tower immediately.",

"It was the same tower from the drawing.",
"The main door was locked.",
"Daniel took the silver key from his pocket.",
"He placed it inside the lock.",
"The lock turned with a quiet click.",
"The heavy door opened slowly.",
"Inside was complete darkness.",
"Daniel turned on his flashlight.",
"The walls were covered with strange paintings.",
"Some paintings showed the same silver key.",

"Daniel walked through several empty rooms.",
"At the center of the largest room was a wooden table.",
"Another notebook rested on the table.",
"It looked much newer than his own notebook.",
"Daniel carefully opened it.",
"The first page contained his own name.",
"He stepped backward in surprise.",
"The following pages described his childhood.",
"Every detail was accurate.",
"Daniel continued reading.",

"The final page contained a single sentence.",
"It said that every journey begins with a question.",
"It also said that answers are rarely found quickly.",
"Daniel finally understood the mystery.",
"The silver key was not the real treasure.",
"The journey itself was the message.",
"He closed the notebook.",
"Outside, the sun was beginning to set.",
"Daniel left the tower.",
"He carried both notebooks with him."

];


/* VARIABLES */

let currentPage = 1;

let timerStarted = false;

let currentLines = [];


/* CREATE PAGE */

function makePage(){

  let lines = [];

  for(let i=0;i<2;i++){

    storyLines.forEach(line=>{
      lines.push(line);
    });

  }

  return lines;

}


/* RENDER PAGE */

function renderPage(){

  const box =
    document.getElementById("story");

  const search =
    document.getElementById("search");

  const result =
    document.getElementById("result");

  const button =
    document.getElementById("continueBtn");


  box.innerHTML = "";

  search.value = "";

  result.style.display = "none";

  timerStarted = false;

  currentLines = makePage();


  currentLines.forEach((text,index)=>{

    const p =
      document.createElement("p");

    p.className = "line";

    p.textContent = text;

    box.appendChild(p);


    if((index+1)%10===0){

      const gap =
        document.createElement("div");

      gap.className = "gap";

      box.appendChild(gap);

    }

  });


  /* PAGE NUMBER */

  document.getElementById(
    "pageNumber"
  ).textContent = currentPage;


  document.getElementById(
    "pageNumberBottom"
  ).textContent = currentPage;


  /* PROGRESS */

  const percentage =
    (currentPage/TOTAL_PAGES)*100;


  document.getElementById(
    "progress"
  ).style.width =
    percentage+"%";


  document.getElementById(
    "progressBottom"
  ).style.width =
    percentage+"%";


  /* TIMER */

  document.getElementById(
    "count"
  ).textContent =
    WAIT_SECONDS;


  button.disabled = true;

  button.classList.remove("ready");

  button.textContent =
    currentPage < TOTAL_PAGES
    ? "Continue"
    : "GET KEY / FILE";

}


/* SEARCH */

document
.getElementById("search")
.addEventListener("input",function(){

  const query =
    this.value.trim().toLowerCase();

  const box =
    document.getElementById("story");

  const result =
    document.getElementById("result");


  if(!query){

    renderPage();

    return;

  }


  const matches =
    currentLines.filter(line =>
      line.toLowerCase().includes(query)
    );


  result.style.display =
    "block";

  result.textContent =
    matches.length +
    " result(s) found.";


  box.innerHTML = "";


  matches.forEach(line=>{

    const p =
      document.createElement("p");

    p.className = "line";

    p.textContent = line;

    box.appendChild(p);

  });

});


/* TIMER */

function checkBottom(){

  if(timerStarted)
    return;


  const position =
    window.scrollY +
    window.innerHeight;


  const height =
    document.documentElement.scrollHeight;


  if(position >= height-30){

    timerStarted = true;


    let remaining =
      WAIT_SECONDS;


    const count =
      document.getElementById("count");

    const button =
      document.getElementById(
        "continueBtn"
      );


    count.textContent =
      remaining;


    const timer =
      setInterval(()=>{

        remaining--;

        count.textContent =
          Math.max(
            remaining,
            0
          );


        if(remaining <= 0){

          clearInterval(timer);

          button.disabled =
            false;

          button.classList.add(
            "ready"
          );

        }

      },1000);

  }

}


window.addEventListener(
  "scroll",
  checkBottom,
  {passive:true}
);


/* CONTINUE */

document
.getElementById("continueBtn")
.addEventListener("click",function(){

  if(this.disabled)
    return;


  /* LAST PAGE */

  if(currentPage === TOTAL_PAGES){

    document.getElementById(
      "finalLink"
    ).href =
      DESTINATION_URL;


    document.getElementById(
      "story"
    ).style.display =
      "none";


    document.querySelector(
      ".bottom"
    ).style.display =
      "none";


    document.querySelector(
      ".bottom-page"
    ).style.display =
      "none";


    document.getElementById(
      "final"
    ).style.display =
      "block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

    return;

  }


  /* NEXT PAGE */

  currentPage++;

  renderPage();


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

});


/* START */

renderPage();

</script>

</body>
  </html>
