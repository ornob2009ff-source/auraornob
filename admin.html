<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<style>
body{font-family:Arial,sans-serif;background:#0f1115;color:#fff;margin:0;padding:24px}
.card{max-width:560px;margin:30px auto;background:#191d24;padding:22px;border-radius:16px}
input,textarea,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px;border-radius:10px;border:1px solid #444;background:#111;color:#fff}
button{background:#fff;color:#111;border:0;font-weight:700}
small{color:#aaa}
</style>
</head>
<body>
<div class="card">
<h2>Admin Panel</h2>
<p><small>This panel is a local settings editor. GitHub Pages cannot securely write files by itself.</small></p>
<label>Adsterra key</label>
<input id="key" placeholder="Enter Adsterra key">
<label>Ad script / code</label>
<textarea id="code" rows="8" placeholder="Paste your Adsterra code here"></textarea>
<button onclick="save()">Save settings</button>
<p id="msg"></p>
</div>
<script>
const KEY='auraornob_ad_config';
const old=JSON.parse(localStorage.getItem(KEY)||'{}');
key.value=old.key||'';
code.value=old.code||'';
function save(){
 localStorage.setItem(KEY,JSON.stringify({key:key.value.trim(),code:code.value}));
 msg.textContent='Saved on this device.';
}
</script>
</body>
</html>
